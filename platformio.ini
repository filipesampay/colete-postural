; Colete Postural — firmware ESP32 (PlatformIO + Arduino)
;   pio run                   compila
;   pio run -t upload         grava
;   pio device monitor        serial (115200)
;   pio test -e native        testes da lógica de postura (roda no PC, sem placa)
;
; Dois ambientes: "esp32dev" (o firmware da placa) e "native" (testes da lógica pura no PC).
; Documentação: Documentação/01-visao-geral.md e Documentação/09-simulador-testes-ferramentas.md

[platformio]
default_envs = esp32dev

; ---------------------------------------------------------------- firmware da placa
[env:esp32dev]
; versão fixa da plataforma = Arduino-ESP32 core 2.0.17 (atualizar pode mudar APIs, ex.: LEDC)
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; traduz o backtrace de um travamento (Guru Meditation) em arquivo e linha do código
monitor_filters = esp32_exception_decoder
; se a gravação falhar, trocar para 460800 ou 115200
upload_speed = 921600
; sem logs do core na serial: ela fica só para os comandos, o "diag" e o "plot on"
build_flags = -DCORE_DEBUG_LEVEL=0
; versões fixas das bibliotecas (servidor WebSocket e JSON do protocolo do app)
lib_deps =
    links2004/WebSockets@2.7.3
    bblanchon/ArduinoJson@7.2.1
; página do app embutida no firmware (vira os símbolos _binary_src_web_*)
; cada arquivo ganha um '\0' no fim, por isso src/web.cpp pode tratá-lo como string C
board_build.embed_txtfiles =
    src/web/index.html
    src/web/manifest.json
    src/web/icon.svg
; os testes não rodam na placa, só no ambiente native
test_ignore = *

; ---------------------------------------------------------------- testes no PC
[env:native]
platform = native
test_framework = unity
; compila também o código de src/ junto com o teste, mas só a lógica pura (sem Arduino):
; tilt.cpp e posture.cpp (filters.h é só cabeçalho e entra pelo #include)
test_build_src = yes
build_src_filter = -<*> +<tilt.cpp> +<posture.cpp>
build_flags = -std=c++11 -Wall
